# Builds the Astro/Starlight docs site in image-analysis-pipeline/frontend and
# publishes it to GitHub Pages. One-time setup: repo Settings > Pages >
# Source = "GitHub Actions".
name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - 'image-analysis-pipeline/frontend/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: image-analysis-pipeline/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: image-analysis-pipeline/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: image-analysis-pipeline/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
